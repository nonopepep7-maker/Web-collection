<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess-up</title>
    <link rel="icon" type="image/x-icon" href="https://images.icon-icons.com/81/PNG/256/arrow_top_15603.png" />

    <style>
        h1 {
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation-name: honey;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            display: inline-block;
            cursor: pointer;

        }

        @keyframes honey {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0);
            }
        }

        h1:hover {
            color: #7dd3fc;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7);
            font-size: 50px;
            display: inline-block;

        }

        .yea {


            text-align: center;

        }

        body {
            background-image: url('https://4kwallpapers.com/images/walls/thumbs_2t/25837.png');
            background-size: cover;
        }

        .loginform {
            background-color: rgba(0, 0, 0, 0.72);
            color: #d4d4d4;
            text-align: center;
            padding: 12px 0;
            border-top: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.25);
            width: 300px;
            margin: 50px auto;
            border-radius: 8px;
        }

        h2 {
            color: #ac1f1f;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.925);
            animation-name: lefttorightstyle;
            animation-duration: 18s;
            animation-iteration-count: 2;
            position: fixed;
            background-color: black;
            filter: blur(1px);
        }

        @keyframes lefttorightstyle {
            0% {
                transform: translateX(0px);
            }

            100% {
                transform: translateX(800px);
            }
        }
    </style>

</head>

<body>
    <header>
        <div class="yea">
            <h1>Mess-up</h1>


        </div>

    </header>

    <div class="loginform">

        <form
            onsubmit="if(user.value=='Nirdesh' && pass.value=='plsBestRating'){ window.location.href='dash1.html'; } else if(user.value=='Emma' && pass.value=='iwillgivegoodrating'){ window.location.href='dash2.html'; } else { alert('Wrong login!'); } return false;">
            <label for="user">Username:</label>
            <input type="text" id="user" name="username" required><br><br>

            <label for="pass">Password:</label>
            <input type="password" id="pass" name="password" required><br><br>

            <button type="submit">Login</button>
        </form>
        
    </div>

    <h2> To get pass and username go to projects</h2>



</body>

</html>

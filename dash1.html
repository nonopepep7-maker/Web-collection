<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirdesh</title>
    <link rel="icon" type="image/x-icon" href="https://images.icon-icons.com/81/PNG/256/arrow_top_15603.png" />
    <style>

               * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
             
        }

        body {
            background-image:url(goku.jpg) ;
            background-size: cover;
            background-position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard {
            background-color: rgb(236, 188, 188);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        .chat-box {
            border: 1px solid #9f0c0c;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .input {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #004ba1;
            border-radius: 4px;
        }

        .input button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .input button:hover {
            background-color: #0056b3;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .incoming {
            background-color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .outgoing {
            background-color: #007BFF;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            align-self: flex-end;
        }

        .message {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

    
    </style>
</head>

<body>

    <div class="dashboard">
        <h1>Dashboard 1</h1>
        <p>Welcome Nirdesh to the dashboard!</p>
        <div class="chat-box" id="user1-chat"></div>
        <div class="input">
            <h2>Chat Box</h2>
            <input type="text" id="user1-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>

        </div>
        <script src="dash1.js"></script>
    </div>
</body>

</html>
